*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Segoe UI","Quicksand","Nunito",system-ui,-apple-system,sans-serif;
  color:var(--text);background:var(--bg1);
  font-size:14px;line-height:1.4;
  transition:background .5s,color .3s;

button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;color:inherit}

/* ============ BACKGROUND LAYERS ============ */
#bg-deco{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 20% 10%,var(--bg3),transparent 60%),
    radial-gradient(ellipse at 80% 90%,var(--bg2),transparent 60%),
    linear-gradient(135deg,var(--bg1),var(--bg2) 70%,var(--bg3));
  transition:background .6s;
}
#bg-deco::after{
  content:"";position:absolute;inset:0;
  background:var(--pattern);opacity:.6;
}
#particles{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.8}

/* ============ APP LAYOUT ============ */
#app{position:relative;z-index:2;height:100vh;display:flex;gap:0;padding:10px}

/* ============ SIDEBAR ============ */
#sidebar{
  width:250px;flex-shrink:0;display:flex;flex-direction:column;
  background:var(--panel);backdrop-filter:blur(20px) saturate(160%);
  border-radius:22px;padding:14px 10px;
  box-shadow:0 10px 40px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.4);
  transition:width .35s,margin .35s,opacity .3s;overflow:hidden;
}
#sidebar.collapsed{width:66px}
#sidebar.collapsed .sb-label,#sidebar.collapsed .sb-section-title,#sidebar.collapsed .page-meta,#sidebar.collapsed .sb-badge{display:none}
#sidebar.collapsed #logo-text{display:none}
#sidebar.collapsed .logo-img { width: 40px; height: 40px; }
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 12px;border-bottom:1px solid rgba(0,0,0,.08);margin-bottom:12px}
.logo-img {
  width: 56px; 
  height: 56px;
  flex-shrink: 0;
  border-radius: 50%; /* Bo tròn ảnh */
  object-fit: cover; /* Đảm bảo ảnh không bị méo */
  filter: drop-shadow(0 4px 12px var(--glow)); /* Hiệu ứng phát sáng */
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.logo-img:hover {
  transform: scale(1.1) rotate(5deg); /* Hiệu ứng rê chuột dễ thương */
}
#logo-text h1{font-size:16px;font-weight:800;letter-spacing:.3px;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
#logo-text p{font-size:10px;color:var(--text-dim);font-weight:600;letter-spacing:.5px;white-space:nowrap}
.sb-section-title{font-size:10px;font-weight:800;letter-spacing:1.2px;color:var(--text-dim);padding:10px 8px 6px;text-transform:uppercase}
#pages-list{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:4px;padding:2px;min-height:0}
.page-item{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;
  cursor:pointer;transition:.2s;position:relative;border:1px solid transparent;user-select:none;
}
.page-item:hover{background:rgba(255,255,255,.4);transform:translateX(2px)}
.page-item.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-text);box-shadow:0 6px 16px var(--glow);border-color:rgba(255,255,255,.3)}
.page-item.active .page-meta{color:rgba(255,255,255,.85)}
.page-icon{font-size:18px;flex-shrink:0;width:22px;text-align:center}
.page-meta{flex:1;min-width:0;overflow:hidden}
.page-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-sub{font-size:10px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-item .page-actions{display:none;gap:2px}
.page-item:hover .page-actions{display:flex}
.page-item .page-actions button{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;background:rgba(255,255,255,.5)}
.page-item .page-actions button:hover{background:rgba(255,255,255,.9);transform:scale(1.1)}
.sb-bottom{padding-top:10px;border-top:1px solid rgba(0,0,0,.08);display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.sb-btn{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:11px;
  font-size:12.5px;font-weight:700;transition:.2s;border:1px solid transparent;width:100%;text-align:left;
}
.sb-btn:hover{background:rgba(255,255,255,.5);transform:translateX(2px)}
.sb-btn .sb-label{white-space:nowrap}
.sb-btn svg{width:18px;height:18px;flex-shrink:0}
.sb-badge{margin-left:auto;background:var(--accent);color:var(--accent-text);font-size:10px;padding:2px 6px;border-radius:8px;font-weight:800}
#new-page-btn{margin-top:6px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-text);justify-content:center;box-shadow:0 6px 16px var(--glow);flex-shrink:0}
#new-page-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px var(--glow)}

/* ============ MAIN ============ */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#toolbar{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  background:var(--panel);backdrop-filter:blur(20px) saturate(160%);
  border-radius:22px;margin-bottom:10px;
  box-shadow:0 10px 40px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.4);flex-wrap:wrap;min-height:60px;flex-shrink:0;
}
#page-title-area{display:flex;align-items:center;gap:10px;flex:1;min-width:150px}
#page-title-area .picon{font-size:22px}
#page-title-area h2{font-size:16px;font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#page-title-area .pstat{font-size:11px;color:var(--text-dim);font-weight:700}
.tb-btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:11px;
  font-size:12px;font-weight:800;transition:.2s;white-space:nowrap;
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.6);
  box-shadow:0 3px 0 rgba(0,0,0,.06),0 4px 10px rgba(0,0,0,.05);
}
.tb-btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 rgba(0,0,0,.06),0 8px 18px var(--glow);background:rgba(255,255,255,.85)}
.tb-btn:active{transform:translateY(0);box-shadow:0 1px 0 rgba(0,0,0,.06)}
.tb-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-text);border-color:rgba(255,255,255,.4);box-shadow:0 4px 0 rgba(0,0,0,.12),0 6px 20px var(--glow)}
.tb-btn.primary:hover{box-shadow:0 6px 0 rgba(0,0,0,.12),0 10px 26px var(--glow)}
.tb-btn svg{width:16px;height:16px;flex-shrink:0}
.tb-btn .tb-label{display:inline}
@media(max-width:1100px){.tb-btn .tb-label{display:none}.tb-btn{padding:8px}}

/* ============ WORKSPACE (INFINITE CANVAS) ============ */
#workspace-wrap{
  flex:1;position:relative;border-radius:24px;overflow:auto;
  background:var(--panel-2);backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:inset 0 2px 20px rgba(0,0,0,.06),0 10px 40px rgba(0,0,0,.1);
}
#workspace{
  position:relative;width:3000px;height:3000px;overflow:hidden;
  background-image:
    linear-gradient(rgba(255,255,255,.15) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.15) 1px,transparent 1px);
  background-size:40px 40px;
}
.empty-state{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:40px;text-align:center;pointer-events:none;
  z-index:10;
}
.empty-state svg{width:120px;height:120px;opacity:.5;filter:drop-shadow(0 10px 20px var(--glow));animation:float 4s ease-in-out infinite}
.empty-state h3{font-size:20px;font-weight:800;color:var(--text)}
.empty-state p{font-size:13px;color:var(--text-dim);max-width:340px;font-weight:600}
.empty-state .hint{font-size:11px;color:var(--text-dim);opacity:.8;margin-top:8px}

/* ============ WINDOWS BASE ============ */
.win{
  position:absolute;display:flex;flex-direction:column;
  background:var(--win-bg);border-radius:16px;
  box-shadow:var(--shadow);overflow:visible;
  transition:box-shadow .2s,transform .2s;
  min-width:220px;min-height:130px;
  --win-r:16px;
}
.win::before,.win::after{pointer-events:none}
.win-inner{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
  border-radius:var(--win-r);background:var(--win-bg);
  border:2px solid var(--win-border);position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
}
.win.focused{box-shadow:0 0 0 2px var(--accent),var(--shadow),0 0 30px var(--glow)}
.win.minimized .win-body,.win.minimized .win-tb-sub{display:none}
.win.minimized{min-height:auto!important;height:auto!important}
.win.maximized{left:12px!important;top:12px!important;width:calc(100% - 24px)!important;height:calc(100% - 24px)!important}
.win-titlebar{
  display:flex;align-items:center;gap:6px;padding:8px 10px;
  background:var(--win-title);color:var(--win-title-text);
  border-radius:calc(var(--win-r) - 2px) calc(var(--win-r) - 2px) 0 0;
  cursor:move;user-select:none;flex-shrink:0;min-height:36px;
  position:relative;
}
.win-titlebar::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.25),transparent 50%);border-radius:inherit;pointer-events:none}
.win-tb-sub{font-size:9.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;max-width:100%}
.win-title{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;position:relative;z-index:1}
.win-favicon{font-size:13px;flex-shrink:0;position:relative;z-index:1}
.win-actions{display:flex;gap:3px;position:relative;z-index:1}
.win-actions button{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  font-size:11px;color:inherit;background:rgba(255,255,255,.22);transition:.15s;
}
.win-actions button:hover{background:rgba(255,255,255,.45);transform:scale(1.12)}
.win-actions button.close:hover{background:#ff5a7a;color:#fff}
.win-body{flex:1;overflow:hidden;position:relative;background:var(--win-bg);border-radius:0 0 calc(var(--win-r) - 2px) calc(var(--win-r) - 2px)}
.win-body iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.win-tb-bottom{display:flex;gap:2px;padding:3px 6px;font-size:9px;color:var(--text-dim);background:rgba(0,0,0,.03);border-top:1px solid rgba(0,0,0,.04);align-items:center;flex-shrink:0}
.win-tb-bottom .url-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:monospace;font-size:9.5px;padding:0 4px}
.win-tb-bottom button{padding:2px 6px;border-radius:5px;font-size:9px;font-weight:700;background:rgba(255,255,255,.5);border:1px solid rgba(0,0,0,.06)}
.win-tb-bottom button:hover{background:var(--accent);color:var(--accent-text)}
.win-placeholder{padding:24px;text-align:center;color:var(--text-dim);font-size:12px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;height:100%;background:linear-gradient(135deg,var(--win-bg),var(--panel-2))}
.win-placeholder .big-emoji{font-size:38px;animation:float 3s ease-in-out infinite}
.win-placeholder button{padding:6px 14px;border-radius:9px;background:var(--accent);color:var(--accent-text);font-size:11px;font-weight:800}

/* resize handles */
.rh{position:absolute;z-index:5}
.rh.n{top:-4px;left:10px;right:10px;height:8px;cursor:ns-resize}
.rh.s{bottom:-4px;left:10px;right:10px;height:8px;cursor:ns-resize}
.rh.w{left:-4px;top:10px;bottom:10px;width:8px;cursor:ew-resize}
.rh.e{right:-4px;top:10px;bottom:10px;width:8px;cursor:ew-resize}
.rh.nw{left:-4px;top:-4px;width:14px;height:14px;cursor:nwse-resize}
.rh.ne{right:-4px;top:-4px;width:14px;height:14px;cursor:nesw-resize}
.rh.sw{left:-4px;bottom:-4px;width:14px;height:14px;cursor:nesw-resize}
.rh.se{right:-4px;bottom:-4px;width:14px;height:14px;cursor:nwse-resize}
.win.dragging,.win.resizing{transition:none!important;will-change:left,top,width,height}
.win.dragging iframe,.win.resizing iframe{pointer-events:none}

/* ============ 100 FRAMES ============ */
/* 1-50 Old Frames */
.win[data-frame="mochi"]{--win-r:22px}
.win[data-frame="mochi"] .win-inner{border-width:4px;border-radius:22px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),inset 0 -4px 12px rgba(0,0,0,.05),0 8px 24px var(--glow)}
.win[data-frame="cat"]{--win-r:20px}
.win[data-frame="cat"]::before,.win[data-frame="cat"]::after{content:"";position:absolute;top:-16px;width:34px;height:36px;background:var(--win-border);clip-path:polygon(50% 0,0 100%,100% 100%);filter:drop-shadow(0 -3px 4px var(--glow))}
.win[data-frame="cat"]::before{left:14px;transform:rotate(-8deg)}
.win[data-frame="cat"]::after{right:14px;transform:rotate(8deg)}
.win[data-frame="cat"] .win-inner{border-width:3px;border-radius:20px}
.win[data-frame="bunny"]{--win-r:18px}
.win[data-frame="bunny"]::before,.win[data-frame="bunny"]::after{content:"";position:absolute;top:-30px;width:16px;height:40px;background:var(--win-border);border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
.win[data-frame="bunny"]::before{left:24px;transform:rotate(-10deg)}
.win[data-frame="bunny"]::after{right:24px;transform:rotate(10deg)}
.win[data-frame="bunny"] .win-inner{border-width:3px;border-radius:18px 18px 26px 26px}
.win[data-frame="cloud"]{--win-r:30px}
.win[data-frame="cloud"] .win-inner{border-width:3px;border-radius:30px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.4),0 10px 30px var(--glow)}
.win[data-frame="cloud"]::before{content:"";position:absolute;top:-22px;left:20%;width:40px;height:40px;border-radius:50%;background:var(--win-border);box-shadow:50px -6px 0 -4px var(--win-border),-40px 4px 0 -6px var(--win-border)}
.win[data-frame="cloud"]::after{content:"";position:absolute;bottom:-22px;right:22%;width:36px;height:36px;border-radius:50%;background:var(--win-border);box-shadow:-50px 4px 0 -6px var(--win-border)}
.win[data-frame="lace"] .win-inner{border:4px dotted var(--win-border);border-radius:20px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5),0 6px 20px var(--glow)}
.win[data-frame="lace"] .win-titlebar{border-radius:16px 16px 0 0;background:repeating-linear-gradient(45deg,var(--win-title) 0 8px,transparent 8px 16px),var(--accent)}
.win[data-frame="crystal"]{--win-r:4px}
.win[data-frame="crystal"] .win-inner{border:2px solid var(--win-border);border-radius:4px;clip-path:polygon(0 12px,12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px));background:linear-gradient(135deg,var(--win-bg),rgba(200,220,255,.3));box-shadow:0 0 20px var(--glow),inset 0 0 20px rgba(255,255,255,.4)}
.win[data-frame="crystal"] .win-titlebar{border-radius:0;background:linear-gradient(135deg,var(--accent),var(--accent-2));clip-path:polygon(0 12px,12px 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.win[data-frame="angel"]{--win-r:20px}
.win[data-frame="angel"]::before,.win[data-frame="angel"]::after{content:"";position:absolute;top:30%;width:40px;height:70px;background:radial-gradient(ellipse at center,rgba(255,245,200,.95),rgba(255,220,150,.4));border-radius:50% 50% 50% 50%/60% 60% 40% 40%;filter:drop-shadow(0 4px 10px rgba(255,220,150,.8))}
.win[data-frame="angel"]::before{left:-34px;transform:rotate(-25deg)}
.win[data-frame="angel"]::after{right:-34px;transform:rotate(25deg)}
.win[data-frame="angel"] .win-inner{border:3px solid var(--win-border);border-radius:20px;box-shadow:inset 0 0 20px rgba(255,230,150,.4),0 0 30px var(--glow)}
.win[data-frame="sakura"] .win-inner{border:3px solid var(--win-border);border-radius:20px;box-shadow:0 6px 20px var(--glow)}
.win[data-frame="sakura"]::before{content:"✿";position:absolute;top:-18px;left:14px;font-size:26px;color:var(--accent);filter:drop-shadow(0 2px 4px var(--glow));z-index:2}
.win[data-frame="sakura"]::after{content:"✿";position:absolute;bottom:-18px;right:16px;font-size:22px;color:var(--accent-2);filter:drop-shadow(0 2px 4px var(--glow));z-index:2}
.win[data-frame="strawberry"] .win-inner{border:3px solid var(--win-border);border-radius:24px 24px 20px 20px;box-shadow:0 8px 24px var(--glow)}
.win[data-frame="strawberry"]::before{content:"";position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:30px;height:20px;background:linear-gradient(135deg,#6ac26a,#4aa04a);clip-path:polygon(50% 100%,0 0,20% 30%,40% 10%,60% 10%,80% 30%,100% 0);z-index:2}
.win[data-frame="strawberry"]::after{content:"";position:absolute;top:2px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:#fff;opacity:.4}
.win[data-frame="cake"] .win-inner{border:4px solid var(--win-border);border-radius:8px 8px 16px 16px;box-shadow:0 8px 24px var(--glow),inset 0 -8px 0 rgba(255,200,220,.4)}
.win[data-frame="cake"]::before{content:"";position:absolute;top:-8px;left:0;right:0;height:16px;background:repeating-linear-gradient(90deg,#ff9bc5 0 8px,#ffe4ee 8px 16px);border-radius:8px 8px 0 0;z-index:2}
.win[data-frame="shooting-star"] .win-inner{border:3px solid var(--win-border);border-radius:18px;box-shadow:0 0 30px var(--glow),inset 0 0 20px rgba(255,255,220,.2)}
.win[data-frame="shooting-star"]::before{content:"⭐";position:absolute;top:-18px;right:20px;font-size:22px;filter:drop-shadow(0 2px 6px var(--glow));z-index:2;animation:twinkle 2s ease-in-out infinite}
.win[data-frame="moon"] .win-inner{border:3px solid var(--win-border);border-radius:30px 18px 18px 30px;box-shadow:0 0 30px var(--glow)}
.win[data-frame="moon"]::before{content:"☾";position:absolute;top:-20px;left:-14px;font-size:36px;color:var(--accent);filter:drop-shadow(0 0 10px var(--glow));z-index:2}
.win[data-frame="ocean"] .win-inner{border:3px solid var(--win-border);border-radius:20px;background:linear-gradient(180deg,var(--win-bg) 0%,rgba(200,240,255,.4) 100%);box-shadow:0 8px 24px var(--glow)}
.win[data-frame="ocean"]::before{content:"";position:absolute;inset:0;border-radius:20px;background:radial-gradient(circle at 15% 85%,rgba(180,230,255,.7) 0 6px,transparent 7px),radial-gradient(circle at 80% 20%,rgba(180,230,255,.5) 0 4px,transparent 5px),radial-gradient(circle at 50% 95%,rgba(180,230,255,.6) 0 5px,transparent 6px),radial-gradient(circle at 90% 60%,rgba(180,230,255,.5) 0 3px,transparent 4px);pointer-events:none;z-index:2}
.win[data-frame="coral"] .win-inner{border:3px solid #ff9a8a;border-radius:20px;box-shadow:0 8px 24px rgba(255,140,120,.4)}
.win[data-frame="coral"]::before{content:"";position:absolute;bottom:-8px;left:0;right:0;height:16px;background:radial-gradient(circle at 20% 0,#ff7a6a 0 8px,transparent 9px),radial-gradient(circle at 50% 0,#ff8a7a 0 10px,transparent 11px),radial-gradient(circle at 80% 0,#ff6a5a 0 7px,transparent 8px);z-index:2}
.win[data-frame="butterfly"] .win-inner{border:3px solid var(--win-border);border-radius:22px;box-shadow:0 8px 24px var(--glow)}
.win[data-frame="butterfly"]::before{content:"🦋";position:absolute;top:-16px;right:-14px;font-size:28px;filter:drop-shadow(0 2px 6px var(--glow));z-index:2;animation:float 3s ease-in-out infinite}
.win[data-frame="butterfly"]::after{content:"🌸";position:absolute;bottom:-14px;left:-12px;font-size:20px;z-index:2}
.win[data-frame="castle"] .win-inner{border:3px solid var(--win-border);border-radius:4px;box-shadow:0 8px 24px var(--glow)}
.win[data-frame="castle"]::before{content:"";position:absolute;top:-16px;left:10px;right:10px;height:16px;background:var(--win-border);clip-path:polygon(0 100%,0 40%,10% 40%,10% 0,20% 0,20% 40%,30% 40%,30% 0,40% 0,40% 40%,50% 40%,50% 0,60% 0,60% 40%,70% 40%,70% 0,80% 0,80% 40%,90% 40%,90% 0,100% 0,100% 40%,100% 100%);z-index:2}
.win[data-frame="stained-glass"] .win-inner{border:4px solid var(--win-border);border-radius:6px;background:linear-gradient(135deg,var(--win-bg) 0%,rgba(255,200,255,.3) 25%,rgba(200,220,255,.3) 50%,rgba(255,220,200,.3) 75%,var(--win-bg) 100%);box-shadow:inset 0 0 30px rgba(255,200,255,.3),0 8px 24px var(--glow)}
.win[data-frame="sticker"] .win-inner{border:8px solid #fff;border-radius:24px;box-shadow:0 0 0 2px var(--win-border),0 10px 30px var(--glow)}
.win[data-frame="pixel"]{--win-r:0}
.win[data-frame="pixel"] .win-inner{border:4px solid var(--win-border);border-radius:0;box-shadow:8px 8px 0 rgba(0,0,0,.15);image-rendering:pixelated}
.win[data-frame="pixel"] .win-titlebar{border-radius:0;background:repeating-linear-gradient(90deg,var(--accent) 0 4px,var(--accent-2) 4px 8px)}
.win[data-frame="neon"] .win-inner{border:2px solid #00f0ff;border-radius:12px;box-shadow:0 0 15px #00f0ff,0 0 30px rgba(0,240,255,.5),inset 0 0 15px rgba(0,240,255,.3),0 0 50px rgba(255,64,192,.3)}
.win[data-frame="neon"] .win-titlebar{background:linear-gradient(90deg,#0a0a1a,#00f0ff20,#ff40c020);text-shadow:0 0 10px #00f0ff;border-bottom:1px solid #00f0ff}
.win[data-frame="holo"] .win-inner{border:3px solid transparent;border-radius:18px;background:linear-gradient(var(--win-bg),var(--win-bg)) padding-box,linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb,#a6c1ee,#a1c4fd,#c2e9fb,#a1c4fd) border-box;box-shadow:0 8px 24px rgba(180,200,255,.4)}
.win[data-frame="holo"] .win-titlebar{background:linear-gradient(135deg,#ffb0d0,#b0d0ff,#d0b0ff);color:#fff}
.win[data-frame="glass"] .win-inner{border:2px solid rgba(255,255,255,.6);border-radius:20px;background:rgba(255,255,255,.55);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 10px 30px rgba(150,180,255,.3)}
.win[data-frame="glass"] .win-titlebar{background:rgba(255,255,255,.4);backdrop-filter:blur(10px);color:var(--text);border-bottom:1px solid rgba(255,255,255,.5)}
.win[data-frame="glass"] iframe{background:transparent}
.win[data-frame="knit"] .win-inner{border:6px solid var(--win-border);border-radius:16px;background:repeating-linear-gradient(45deg,var(--win-bg) 0 6px,rgba(255,255,255,.3) 6px 12px);box-shadow:0 8px 24px var(--glow)}
.win[data-frame="wood"] .win-inner{border:8px solid #c89060;border-radius:8px;background:repeating-linear-gradient(90deg,rgba(180,130,80,.15) 0 3px,transparent 3px 8px),var(--win-bg);box-shadow:0 8px 24px rgba(150,100,60,.4)}
.win[data-frame="ice"] .win-inner{border:3px solid #a8e0ff;border-radius:14px;background:linear-gradient(135deg,rgba(220,245,255,.9),rgba(180,220,255,.6));box-shadow:0 0 30px rgba(150,220,255,.6),inset 0 0 20px rgba(255,255,255,.6)}
.win[data-frame="ice"]::before,.win[data-frame="ice"]::after{content:"";position:absolute;top:-10px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid #a8e0ff;filter:drop-shadow(0 0 6px rgba(150,220,255,.8))}
.win[data-frame="ice"]::before{left:20px}
.win[data-frame="ice"]::after{right:20px}
.win[data-frame="magic-fire"] .win-inner{border:3px solid #ff7a30;border-radius:18px;box-shadow:0 0 25px rgba(255,122,48,.7),inset 0 0 20px rgba(255,180,80,.3)}
.win[data-frame="magic-fire"]::before,.win[data-frame="magic-fire"]::after{content:"";position:absolute;top:-14px;width:14px;height:22px;background:radial-gradient(ellipse at center,#ffea30,#ff7a30,transparent);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:flicker 1.5s ease-in-out infinite;filter:blur(1px)}
.win[data-frame="magic-fire"]::before{left:20%}
.win[data-frame="magic-fire"]::after{right:20%;animation-delay:.4s}
.win[data-frame="lollipop"] .win-inner{border:5px solid #ff9ad0;border-radius:22px;background:repeating-conic-gradient(from 0deg at 50% 50%,#fff 0deg 15deg,#ffe4ee 15deg 30deg);box-shadow:0 8px 24px rgba(255,150,200,.5)}
.win[data-frame="lollipop"] iframe{background:#fff;border-radius:12px;margin:6px;width:calc(100% - 12px);height:calc(100% - 12px)}
.win[data-frame="chocolate"] .win-inner{border:5px solid #6a3a1a;border-radius:14px;background:linear-gradient(135deg,#8a5a3a,#6a3a1a);box-shadow:0 8px 24px rgba(100,50,20,.5)}

.win[data-frame="frame_083"] .win-inner{border:2px solid #ffaad0;border-radius:20px;background:repeating-linear-gradient(45deg,var(--win-bg) 0 20px,rgba(255,170,208,.1) 20px 22px);box-shadow:inset 0 0 20px rgba(255,170,208,.3),0 8px 24px rgba(255,150,200,.3)}
.win[data-frame="frame_084"] .win-inner{border:2px solid #a8e0ff;border-radius:4px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);box-shadow:0 0 20px rgba(168,224,255,.5)}
.win[data-frame="frame_085"] .win-inner{border:3px solid #e8c8a0;border-radius:20px 20px 4px 4px;box-shadow:0 8px 24px rgba(232,200,160,.4)}
.win[data-frame="frame_085"]::before{content:"🎎";position:absolute;top:-18px;left:14px;font-size:22px;z-index:2}
.win[data-frame="frame_086"] .win-inner{border:6px dashed #ffaad0;border-radius:50%;box-shadow:0 0 20px rgba(255,170,208,.4)}
.win[data-frame="frame_087"] .win-inner{border:2px solid transparent;border-image:linear-gradient(45deg,#ff6a6a,#6ac2e8,#ffd070) 1;border-radius:0;box-shadow:0 8px 24px rgba(150,200,255,.4)}
.win[data-frame="frame_088"] .win-inner{border:4px solid #d0d0e0;border-radius:20px;background:linear-gradient(135deg,rgba(240,240,250,.9),rgba(200,200,220,.7));box-shadow:inset 0 0 20px rgba(255,255,255,.8),0 8px 24px rgba(180,180,200,.5)}
.win[data-frame="frame_089"] .win-inner{border:3px solid #e0e0e0;border-radius:8px;background:repeating-linear-gradient(45deg,rgba(200,200,200,.1) 0 15px,transparent 15px 30px),var(--win-bg);box-shadow:0 8px 24px rgba(180,180,180,.4)}
.win[data-frame="frame_090"] .win-inner{border:2px solid #c8e0ff;border-radius:10px;background:linear-gradient(135deg,rgba(220,240,255,.8),rgba(180,220,255,.5));box-shadow:0 0 20px rgba(200,224,255,.5);clip-path:polygon(0 10px,10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px))}
.win[data-frame="frame_091"] .win-inner{border:2px solid #00f0ff;border-radius:4px;box-shadow:0 0 10px #00f0ff,0 0 20px rgba(0,240,255,.5),inset 0 0 10px rgba(0,240,255,.2)}
.win[data-frame="frame_091"]::before{content:"";position:absolute;top:4px;left:4px;width:6px;height:6px;background:#00f0ff;box-shadow:10px 0 0 #00f0ff,0 10px 0 #00f0ff}
.win[data-frame="frame_092"] .win-inner{border:4px solid #4a4a5a;border-radius:8px;background:#1a1a2a;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.win[data-frame="frame_092"] .win-titlebar{background:#2a2a3a;color:#00f0ff}
.win[data-frame="frame_092"]::before{content:"";position:absolute;bottom:6px;left:10px;width:8px;height:8px;background:#ff5a7a;border-radius:50%;box-shadow:12px 0 0 #ffd070,24px 0 0 #6ac26a}
.win[data-frame="frame_093"] .win-inner{border:3px solid #a0a0b0;border-radius:4px;background:#e0e0e8;box-shadow:inset 0 0 20px rgba(150,150,160,.3),0 8px 24px rgba(100,100,120,.4)}
.win[data-frame="frame_093"] .win-titlebar{background:#c0c0c8;color:#3a3a4a}
.win[data-frame="frame_093"]::before{content:"";position:absolute;top:-12px;left:10px;right:10px;height:12px;background:repeating-linear-gradient(90deg,#a0a0b0 0 10px,#c0c0d0 10px 20px);border-radius:4px 4px 0 0}
.win[data-frame="frame_094"] .win-inner{border:3px solid #6a6a8a;border-radius:8px;background:linear-gradient(135deg,#8a8aaa,#4a4a6a);box-shadow:0 8px 24px rgba(60,60,80,.5)}
.win[data-frame="frame_094"]::before{content:"";position:absolute;top:-10px;left:20%;right:20%;height:10px;background:#6a6a8a;clip-path:polygon(0 100%,10% 0,30% 100%,50% 0,70% 100%,90% 0,100% 100%)}
.win[data-frame="frame_095"] .win-inner{border:2px solid #00f0ff;border-radius:12px;box-shadow:0 0 15px #00f0ff,inset 0 0 15px rgba(0,240,255,.3)}
.win[data-frame="frame_095"]::before{content:"";position:absolute;bottom:-10px;left:10%;right:10%;height:10px;background:repeating-linear-gradient(90deg,#00f0ff 0 4px,transparent 4px 8px)}
.win[data-frame="frame_096"] .win-inner{border:4px solid #e8c8a0;border-radius:50%;box-shadow:0 0 20px rgba(232,200,160,.6),inset 0 0 20px rgba(255,240,220,.4)}
.win[data-frame="frame_096"]::before{content:"";position:absolute;top:-10px;left:-10px;right:-10px;bottom:-10px;border:4px solid rgba(232,200,160,.4);border-radius:50%}
.win[data-frame="frame_097"] .win-inner{border:3px solid #ffd070;border-radius:10px;box-shadow:0 0 30px rgba(255,208,112,.6)}
.win[data-frame="frame_097"]::before{content:"";position:absolute;top:-20px;right:-20px;width:40px;height:40px;background:radial-gradient(circle at 30% 30%,#ffea30,#ff9a30,transparent);border-radius:50%;filter:blur(2px)}
.win[data-frame="frame_098"] .win-inner{border:2px solid #4a4a6a;border-radius:50%;background:#1a1a2a;box-shadow:0 0 40px #4a4a6a,0 0 80px rgba(74,74,106,.5),inset 0 0 20px #000}
.win[data-frame="frame_098"]::before{content:"";position:absolute;top:-15px;left:-15px;right:-15px;bottom:-15px;border:2px solid rgba(106,106,138,.5);border-radius:50%}
.win[data-frame="frame_098"] .win-titlebar{background:#2a2a3a;color:#a0a0c0}
.win[data-frame="frame_099"] .win-inner{border:4px solid #e0e0e8;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);background:linear-gradient(135deg,rgba(240,240,250,.9),rgba(200,200,220,.7));box-shadow:0 8px 30px rgba(180,180,200,.5)}
.win[data-frame="frame_099"]::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;background:rgba(150,150,170,.5)}
.win[data-frame="frame_100"] .win-inner{border:3px solid #c8a0ff;border-radius:16px;background:linear-gradient(135deg,rgba(200,160,255,.1),rgba(255,200,255,.1)),var(--win-bg);box-shadow:0 0 30px rgba(200,160,255,.5)}
.win[data-frame="frame_100"]::before{content:"";position:absolute;top:-20px;left:20px;width:20px;height:20px;border:2px solid #c8a0ff;transform:rotate(45deg)}
.win[data-frame="frame_100"]::after{content:"";position:absolute;bottom:-20px;right:20px;width:20px;height:20px;border:2px solid #c8a0ff;transform:rotate(45deg)}

/* ============ ANIMATIONS ============ */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes twinkle{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.2)}}
@keyframes flicker{0%,100%{transform:scaleY(1);opacity:.9}50%{transform:scaleY(1.2);opacity:1}}
@keyframes winIn{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes winOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.85)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.win.new{animation:winIn .35s cubic-bezier(.34,1.56,.64,1)}
.win.closing{animation:winOut .25s ease forwards;pointer-events:none}
.modal{animation:fadeIn .2s ease}
.modal .modal-box{animation:slideUp .3s cubic-bezier(.34,1.56,.64,1)}

/* ============ MODALS ============ */
.modal-backdrop{position:fixed;inset:0;background:rgba(20,10,40,.45);backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
.modal-box{
  background:var(--panel-solid);border-radius:24px;max-width:560px;width:100%;max-height:88vh;
  box-shadow:0 30px 80px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.4),inset 0 1px 0 rgba(255,255,255,.6);
  display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.4);
}
.modal-box.wide{max-width:900px}
.modal-head{padding:18px 22px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-text);display:flex;align-items:center;gap:10px;flex-shrink:0}
.modal-head h2{font-size:16px;font-weight:800;flex:1}
.modal-head .m-icon{font-size:22px}
.modal-close{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.25);font-size:16px;color:inherit;transition:.2s}
.modal-close:hover{background:rgba(255,255,255,.5);transform:rotate(90deg)}
.modal-body{padding:20px 22px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 22px;border-top:1px solid rgba(0,0,0,.08);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;background:rgba(0,0,0,.02)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:800;margin-bottom:6px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:10px 12px;border-radius:11px;
  border:2px solid rgba(0,0,0,.08);background:rgba(255,255,255,.7);
  font-size:13px;transition:.2s;color:var(--text);
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.form-row{display:flex;gap:8px;align-items:flex-end}
.form-row .form-group{flex:1;margin-bottom:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:9px 16px;border-radius:11px;font-size:12.5px;font-weight:800;transition:.2s;border:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.8)}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-text);border-color:transparent;box-shadow:0 4px 14px var(--glow)}
.btn.danger{background:#ff5a7a;color:#fff}
.btn.ghost{background:transparent;border:2px solid rgba(0,0,0,.1)}
.btn.sm{padding:6px 11px;font-size:11px;border-radius:9px}
.mini-input{padding:6px 10px;border-radius:8px;border:2px solid rgba(0,0,0,.08);background:rgba(255,255,255,.7);font-size:12px;width:100%}
.range-row{display:flex;align-items:center;gap:10px;margin-top:6px}
.range-row input[type=range]{flex:1;accent-color:var(--accent)}
.range-val{font-size:11px;font-weight:800;min-width:50px;text-align:right;color:var(--accent)}

/* Gallery */
.gallery-grid{display:grid;gap:12px}
.theme-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.frame-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.theme-card,.frame-card{
  border-radius:16px;overflow:hidden;cursor:pointer;position:relative;
  background:rgba(255,255,255,.5);border:2px solid transparent;transition:.25s;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}
.theme-card:hover,.frame-card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.15);border-color:var(--accent)}
.theme-card.active,.frame-card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow),0 8px 20px var(--glow)}
.theme-preview{height:80px;position:relative;overflow:hidden}
.theme-preview-inner{position:absolute;inset:0}
.theme-preview .mini-win{position:absolute;right:6px;bottom:6px;width:50px;height:36px;background:rgba(255,255,255,.9);border-radius:5px;box-shadow:0 2px 6px rgba(0,0,0,.15);border:1px solid rgba(0,0,0,.08)}
.theme-preview .mini-win::before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:var(--mini-title,#ccc);border-radius:4px 4px 0 0}
.theme-card .card-label{padding:8px 10px;font-size:11.5px;font-weight:800;text-align:center;background:rgba(255,255,255,.8);color:#333}
.theme-card.active .card-label{background:var(--accent);color:var(--accent-text)}
.frame-card .frame-preview{padding:22px 14px 10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.3);height:120px;position:relative;overflow:visible}
.frame-card .mini-frame{
  width:80px;height:50px;position:relative;background:#fff;border-radius:8px;
  display:flex;flex-direction:column;overflow:visible;
}
.frame-card .mini-frame .mf-tb{height:10px;border-radius:6px 6px 0 0;background:var(--accent);flex-shrink:0}
.frame-card .mini-frame .mf-body{flex:1;background:#fff;border-radius:0 0 6px 6px;border:1px solid rgba(0,0,0,.06);border-top:none}
.frame-card .card-label{padding:6px 8px;font-size:10.5px;font-weight:800;text-align:center;background:rgba(255,255,255,.8);color:#333}
.frame-card.active .card-label{background:var(--accent);color:var(--accent-text)}
.frame-card .fav-btn{position:absolute;top:4px;right:4px;font-size:14px;opacity:.5;z-index:5;background:none;border:none}
.frame-card .fav-btn:hover,.frame-card .fav-btn.active{opacity:1;transform:scale(1.2)}
.search-row{display:flex;gap:8px;margin-bottom:14px}
.search-row input{flex:1}
.filter-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:800;background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.08);transition:.2s;cursor:pointer}
.chip:hover{background:var(--accent-2)}
.chip.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-text);border-color:transparent;box-shadow:0 3px 10px var(--glow)}
.pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:16px;font-size:12px;font-weight:800}
.pagination button{padding:6px 12px;border-radius:8px;background:rgba(0,0,0,.05)}
.pagination button:hover:not(:disabled){background:var(--accent);color:var(--accent-text)}
.pagination button:disabled{opacity:.3;cursor:not-allowed}

/* Mode Center */
.mode-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.mode-card{
  background:rgba(255,255,255,.6);border-radius:16px;padding:14px;border:2px solid transparent;
  cursor:pointer;transition:.2s;box-shadow:0 4px 12px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:6px;
}
.mode-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.1);border-color:var(--accent-2)}
.mode-card.active{border-color:var(--accent);background:rgba(255,255,255,.9);box-shadow:0 0 0 3px var(--glow)}
.mode-card .mc-icon{font-size:24px}
.mode-card .mc-name{font-size:13px;font-weight:800}
.mode-card .mc-desc{font-size:11px;color:var(--text-dim);line-height:1.3;flex:1}
.mode-card .mc-status{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;align-self:flex-start;padding:2px 8px;border-radius:8px;background:rgba(0,0,0,.05)}
.mode-card.active .mc-status{background:var(--accent);color:var(--accent-text)}

/* Widgets (Pomodoro, Notes, etc) */
.floating-widget{
  position:fixed;bottom:20px;right:20px;z-index:500;
  background:var(--panel-solid);border-radius:20px;padding:16px;width:300px;
  box-shadow:0 20px 50px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.4);
  display:none;flex-direction:column;gap:12px;border:2px solid var(--accent);
}
.floating-widget.show{display:flex;animation:slideUp .3s}
.fw-header{display:flex;align-items:center;justify-content:space-between}
.fw-title{font-size:14px;font-weight:800;color:var(--accent)}
.fw-close{width:24px;height:24px;border-radius:6px;background:rgba(0,0,0,.05);font-weight:800}
.fw-timer{font-size:36px;font-weight:800;text-align:center;font-family:monospace;color:var(--text)}
.fw-notes textarea{width:100%;height:150px;border-radius:10px;padding:8px;border:1px solid rgba(0,0,0,.1);background:rgba(255,255,255,.8);resize:none;font-size:12px}
.fw-task-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto}
.fw-task{display:flex;align-items:center;gap:8px;padding:6px;background:rgba(255,255,255,.6);border-radius:8px;font-size:12px}
.fw-task input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}

/* Window Manager */
.wm-list{display:flex;flex-direction:column;gap:8px}
.wm-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.5);border:1px solid rgba(0,0,0,.06);transition:.2s}
.wm-item:hover{background:rgba(255,255,255,.9);transform:translateX(2px)}
.wm-item .wm-check{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}
.wm-item .wm-info{flex:1;min-width:0}
.wm-item .wm-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wm-item .wm-url{font-size:10.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wm-item .wm-meta{font-size:10px;color:var(--text-dim);text-align:right;flex-shrink:0}
.wm-item .wm-actions{display:flex;gap:4px}
.wm-item .wm-actions button{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:12px;background:rgba(255,255,255,.7)}
.wm-item .wm-actions button:hover{background:var(--accent);color:var(--accent-text)}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 20px;border-radius:14px;background:var(--panel-solid);color:var(--text);font-size:12.5px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.2),0 0 0 1px rgba(255,255,255,.4);animation:slideUp .3s, fadeIn .3s;border:1px solid var(--accent)}
.toast.success{border-color:#4ac86a}
.toast.error{border-color:#ff5a7a}

/* right rail */
#right-rail{
  width:0;flex-shrink:0;transition:width .3s;overflow:hidden;
  background:var(--panel);backdrop-filter:blur(20px);
  border-radius:22px;border:1px solid rgba(255,255,255,.4);
  display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.12);
}
#right-rail.open{width:70px}
#right-rail .rail-btn{width:50px;height:50px;margin:6px auto;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;font-weight:800;background:rgba(255,255,255,.5);transition:.2s}
#right-rail .rail-btn:hover{background:var(--accent);color:var(--accent-text);transform:scale(1.08)}
#right-rail .rail-btn svg{width:20px;height:20px}

/* responsive */
@media(max-width:900px){
  #app{padding:6px;gap:6px}
  #sidebar{width:66px;padding:10px 6px}
  #sidebar .sb-label,#sidebar .sb-section-title,#sidebar .page-meta,#sidebar .sb-badge{display:none}
  #logo-text{display:none}
  #sidebar:not(.collapsed){width:66px}
  .logo{padding:6px;justify-content:center}
  .page-item{padding:8px;justify-content:center}
  .sb-btn{padding:8px;justify-content:center}
  #toolbar{padding:8px 10px;gap:5px}
  .tb-btn{padding:7px;font-size:11px}
  .tb-btn .tb-label{display:none}
  #page-title-area h2{font-size:14px}
  .win{min-width:180px}
  #right-rail.open{width:60px}
  #right-rail .rail-btn{width:44px;height:44px}
}
@media(max-width:600px){
  #app{padding:4px;gap:4px}
  #sidebar{width:54px;padding:6px 4px;border-radius:16px}
  .logo svg{width:30px;height:30px}
  .page-icon{font-size:15px;width:18px}
  #toolbar{border-radius:16px;padding:6px 8px;min-height:52px;margin-bottom:6px}
  #page-title-area{min-width:100px}
  #page-title-area h2{font-size:13px}
  #page-title-area .picon{font-size:18px}
  #page-title-area .pstat{font-size:9.5px}
  .tb-btn{padding:6px;border-radius:9px}
  .tb-btn svg{width:14px;height:14px}
  #workspace-wrap{border-radius:16px}
  .modal-box{max-width:100%;border-radius:18px}
  .modal-head{padding:14px 16px}
  .modal-body{padding:14px 16px}
  .theme-grid,.frame-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .form-grid{grid-template-columns:1fr}
  #right-rail.open{width:52px}
  #right-rail .rail-btn{width:38px;height:38px;font-size:8px}
  #right-rail .rail-btn svg{width:16px;height:16px}
  .floating-widget{width:calc(100% - 20px);bottom:10px;right:10px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
body.reduce-motion *{animation:none!important;transition:none!important}
</style>
</head>
<body>

<div id="bg-deco"></div>

/* ---------- UTILS ---------- */
function uid(p='id'){ return p+'_'+Math.random().toString(36).slice(2,10); }
function qs(s,r=document){ return r.querySelector(s); }
function qsa(s,r=document){ return [...r.querySelectorAll(s)]; }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s || !Array.isArray(s.pages)) return false;
    state = Object.assign(state, s);
    // Migration check
    state.pages.forEach(p => {
      if(!p.mode) p.mode = 'm01';
      p.windows.forEach(w => {
        if(!FRAMES.find(f=>f.id===w.frame)) w.frame = 'mochi';
      });
    });
    if(!state.pages.find(p=>p.id===state.activePageId)) state.activePageId = state.pages[0].id;
    return true;
  }catch(e){ console.warn('Load failed',e); return false; }
}
function toast(msg, type=''){
  const t = document.createElement('div');
  t.className = 'toast '+type;
  t.textContent = msg;
  qs('#toast').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); }, 2200);
}
function getPage(){ return state.pages.find(p=>p.id===state.activePageId) || state.pages[0]; }

/* ---------- VALIDATE URL ---------- */
function normalizeUrl(raw){
  let u = String(raw||'').trim();
  if(!u) return null;
  if(/^https?:\/\//i.test(u)) { /* ok */ }
  else if(/^[a-z]+:/i.test(u)) { return null; }
  else u = 'https://'+u;
  try{
    const parsed = new URL(u);
    if(!['http:','https:'].includes(parsed.protocol)) return null;
    return parsed.href;
  }catch(e){ return null; }
}
function urlHost(u){ try{ return new URL(u).hostname; }catch(e){ return u; } }

/* ---------- RENDER: PAGES ---------- */
function renderPages(){
  const list = qs('#pages-list');
  list.innerHTML = '';
  state.pages.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'page-item' + (p.id===state.activePageId?' active':'');
    el.draggable = true;
    el.dataset.pageId = p.id;
    el.innerHTML = `
      <span class="page-icon">${esc(p.icon||'📄')}</span>
      <div class="page-meta">
        <div class="page-name">${esc(p.name)}</div>
        <div class="page-sub">${p.windows.length} cửa sổ</div>
      </div>
      <div class="page-actions">
        <button title="Đổi tên" data-act="rename">✎</button>
        <button title="Nhân bản" data-act="dup">⧉</button>
        <button title="Xóa" data-act="del">✕</button>
      </div>
    `;
    el.addEventListener('click', (ev) => {
      const act = ev.target.closest('button')?.dataset.act;
      if(act==='rename'){ ev.stopPropagation(); renamePage(p.id); return; }
      if(act==='dup'){ ev.stopPropagation(); duplicatePage(p.id); return; }
      if(act==='del'){ ev.stopPropagation(); deletePage(p.id); return; }
      switchPage(p.id);
    });
    el.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', p.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragover', e=>{ e.preventDefault(); el.style.borderTop = '2px solid var(--accent)'; });
    el.addEventListener('dragleave', ()=>{ el.style.borderTop=''; });
    el.addEventListener('drop', e=>{
      e.preventDefault(); el.style.borderTop='';
      const src = e.dataTransfer.getData('text/plain');
      if(!src || src===p.id) return;
      const fromIdx = state.pages.findIndex(x=>x.id===src);
      const toIdx = state.pages.findIndex(x=>x.id===p.id);
      if(fromIdx<0||toIdx<0) return;
      const [m] = state.pages.splice(fromIdx,1);
      state.pages.splice(toIdx,0,m);
      save(); renderPages();
    });
    list.appendChild(el);
  });
  const page = getPage();
  qs('#win-count-badge').textContent = page ? page.windows.length : 0;
}

/* ---------- RENDER: PAGE HEADER ---------- */
function renderPageHeader(){
  const p = getPage();
  qs('#cur-page-icon').textContent = p.icon || '📄';
  qs('#cur-page-name').textContent = p.name;
  qs('#cur-page-stat').textContent = `${p.windows.length} cửa sổ • ${p.windows.filter(w=>!w.minimized).length} đang hoạt động`;
  document.body.dataset.theme = p.theme || 'pink-mochi';
}

/* ---------- WORKSPACE ---------- */
function renderWorkspace(){
  const ws = qs('#workspace');
  const oldEmpty = ws.querySelector('.empty-state');
  if(oldEmpty) oldEmpty.remove();
  
  const page = getPage();
  
  // Apply Mode layout
  applyModeLayout(page.mode, false);

  // Sync visible windows
  state.pages.forEach(p=>{
    p.windows.forEach(w=>{
      let el = windowEls.get(w.id);
      if(!el){
        el = createWindowEl(w, p.id);
        ws.appendChild(el);
        windowEls.set(w.id, el);
      } else if(el.parentElement !== ws) {
        ws.appendChild(el);
      }
      el.style.display = (p.id===page.id) ? '' : 'none';
    });
  });
  
  const validIds = new Set();
  state.pages.forEach(p=>p.windows.forEach(w=>validIds.add(w.id)));
  for(const [id, el] of windowEls){
    if(!validIds.has(id)){ el.remove(); windowEls.delete(id); }
  }
  
  if(page.windows.length===0){
    ws.insertAdjacentHTML('beforeend', `
      <div class="empty-state">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="32" cy="38" rx="22" ry="20" fill="none" stroke="currentColor" stroke-width="2" opacity=".5"/>
          <ellipse cx="24" cy="36" rx="2.5" ry="3.5" fill="currentColor" opacity=".6"/>
          <ellipse cx="40" cy="36" rx="2.5" ry="3.5" fill="currentColor" opacity=".6"/>
          <path d="M27 46 Q32 50 37 46" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".6"/>
        </svg>
        <h3>Workspace đang trống ✨</h3>
        <p>Nhấn <b>＋ Add New Window</b> để thêm cửa sổ đầu tiên vào không gian của bạn.</p>
        <div class="hint">💡 Mẹo: bạn có thể dán bất kỳ URL nào — nếu website chặn iframe, hãy dùng nút mở tab mới.</div>
      </div>
    `);
  }
  renderPages();
  renderPageHeader();
}

/* ---------- CREATE WINDOW ELEMENT ---------- */
function createWindowEl(w, pageId){
  const el = document.createElement('div');
  el.className = 'win';
  el.dataset.winId = w.id;
  el.dataset.frame = w.frame;
  el.style.left = w.x+'px';
  el.style.top = w.y+'px';
  el.style.width = w.w+'px';
  el.style.height = w.h+'px';
  el.style.zIndex = w.z;
  if(w.minimized) el.classList.add('minimized');
  if(w.maximized) el.classList.add('maximized');
  if(w.pinned) el.classList.add('pinned');
  el.innerHTML = `
    <div class="win-inner">
      <div class="win-titlebar">
        <span class="win-favicon">🌐</span>
        <div style="flex:1;min-width:0;position:relative;z-index:1">
          <div class="win-title">${esc(w.name)}</div>
          <div class="win-tb-sub">${esc(urlHost(w.url))}</div>
        </div>
        <div class="win-actions">
          <button title="Đổi khung ngẫu nhiên" data-act="random-frame">🎲</button>
          <button title="Chỉnh sửa URL" data-act="edit-url">✎</button>
          <button title="Tải lại" data-act="reload">↻</button>
          <button title="Ghim" data-act="pin">📌</button>
          <button title="Nhân bản" data-act="dup">⧉</button>
          <button title="Thu nhỏ" data-act="min">—</button>
          <button title="Phóng to" data-act="max">□</button>
          <button title="Mở tab mới" data-act="ext">↗</button>
          <button title="Đóng" data-act="close" class="close">✕</button>
        </div>
      </div>
      <div class="win-body"></div>
      <div class="win-tb-bottom">
        <span class="url-text">${esc(w.url)}</span>
        <button data-act="settings">⚙ Cài đặt</button>
        <button data-act="open-ext">Mở tab mới ↗</button>
      </div>
    </div>
    <div class="rh n"></div><div class="rh s"></div><div class="rh w"></div><div class="rh e"></div>
    <div class="rh nw"></div><div class="rh ne"></div><div class="rh sw"></div><div class="rh se"></div>
  `;
  loadIframeInto(el.querySelector('.win-body'), w.url);
  wireWindowEvents(el, w.id);
  return el;
}

function loadIframeInto(bodyEl, url){
  bodyEl.innerHTML = '';
  if(!url){
    bodyEl.innerHTML = `<div class="win-placeholder"><div class="big-emoji">🌐</div><div>Chưa có URL</div></div>`;
    return;
  }
  const iframe = document.createElement('iframe');
  iframe.src = url;
  iframe.loading = 'lazy';
  iframe.referrerPolicy = 'no-referrer-when-downgrade';
  iframe.allow = 'fullscreen; autoplay; clipboard-read; clipboard-write';
  iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads';
  bodyEl.appendChild(iframe);
}

/* ---------- WINDOW EVENTS ---------- */
function wireWindowEvents(el, winId){
  el.addEventListener('mousedown', ()=>{
    if(selectedWindowId !== winId){ selectWindow(winId); }
  }, true);

  el.querySelector('.win-titlebar').addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    e.stopPropagation();
    handleWindowAction(winId, btn.dataset.act);
  });
  el.querySelector('.win-tb-bottom').addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    handleWindowAction(winId, btn.dataset.act);
  });

  const tb = el.querySelector('.win-titlebar');
  tb.addEventListener('mousedown', (e)=>{
    if(e.target.closest('button')) return;
    if(e.button !== 0) return;
    startDrag(e, el, winId);
  });

  el.querySelectorAll('.rh').forEach(h=>{
    h.addEventListener('mousedown', (e)=>{
      e.stopPropagation();
      startResize(e, el, winId, h.classList[1]);
    });
  });
}

function handleWindowAction(winId, act){
  const page = getPage();
  const w = page.windows.find(x=>x.id===winId);
  if(!w) return;
  switch(act){
    case 'random-frame': randomFrameWindow(winId); break;
    case 'edit-url': editWindowUrl(winId); break;
    case 'reload': reloadWindow(winId); break;
    case 'pin': togglePin(winId); break;
    case 'dup': duplicateWindow(winId); break;
    case 'min': toggleMinimize(winId); break;
    case 'max': toggleMaximize(winId); break;
    case 'ext': case 'open-ext': window.open(w.url, '_blank', 'noopener,noreferrer'); break;
    case 'close': closeWindow(winId); break;
    case 'settings': openWindowSettings(winId); break;
  }
}

/* ---------- SELECT / FOCUS ---------- */
function selectWindow(winId){
  selectedWindowId = winId;
  const page = getPage();
  const w = page.windows.find(x=>x.id===winId);
  if(!w) return;
  if(w.pinned){ state.maxPinZ++; w.z = state.maxPinZ; }
  else { state.maxZ++; w.z = state.maxZ; }
  
  windowEls.forEach((el, id)=>{
    const win = page.windows.find(x=>x.id===id);
    if(!win) return;
    el.style.zIndex = win.z;
    el.classList.toggle('focused', id===winId);
  });
  save();
}

/* ---------- DRAG ---------- */
let dragCtx = null;
function startDrag(e, el, winId){
  const page = getPage();
  const w = page.windows.find(x=>x.id===winId);
  if(!w) return;
  if(w.maximized) return;
  selectWindow(winId);
  const wsRect = qs('#workspace').getBoundingClientRect();
  dragCtx = {
    el, winId,
    startX: e.clientX, startY: e.clientY,
    origX: w.x, origY: w.y,
    wsRect
  };
  el.classList.add('dragging');
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', endDrag);
  e.preventDefault();
}
function onDrag(e){
  if(!dragCtx) return;
  const {el, startX, startY, origX, origY} = dragCtx;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  let nx = origX + dx;
  let ny = origY + dy;
  
  // Infinite canvas allows moving anywhere within the 3000x3000 workspace
  nx = Math.max(0, Math.min(nx, 3000 - el.offsetWidth));
  ny = Math.max(0, Math.min(ny, 3000 - el.offsetHeight));
  
  el.style.left = nx+'px';
  el.style.top = ny+'px';
}
function endDrag(){
  if(!dragCtx) return;
  const {el, winId} = dragCtx;
  el.classList.remove('dragging');
  const page = getPage();
  const w = page.windows.find(x=>x.id===winId);
  if(w){
    w.x = parseFloat(el.style.left) || 0;
    w.y = parseFloat(el.style.top) || 0;
    save();
  }
  dragCtx = null;
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', endDrag);
}

/* ---------- RESIZE ---------- */
let resizeCtx = null;
function startResize(e, el, winId, dir){
  const page = getPage();
  const w = page.windows.find(x=>x.id===winId);
  if(!w) return;
  selectWindow(winId);
  if(w.maximized){ return; }
  resizeCtx = {
    el, winId, dir,
    startX: e.clientX, startY: e.clientY,
    origX: w.x, origY: w.y, origW: w.w, origH: w.h
  };
  el.classList.add('resizing');
  document.addEventListener('mousemove', onResize);
  document.addEventListener('mouseup', endResize);
  e.preventDefault();
  e.stopPropagation();
}
function onResize(e){
  if(!resizeCtx) return;
  const {el, dir, startX, startY, origX, origY, origW, origH} = resizeCtx;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  let x = origX, y = origY, w = origW, h = origH;
  const MIN = 180;
  if(dir.includes('e')) w = Math.max(MIN, origW + dx);
  if(dir.includes('s')) h = Math.max(100, origH + dy);
  if(dir.includes('w')){ const nw = Math.max(MIN, origW - dx); x = origX + (origW - nw); w = nw; }
  if(dir.includes('n')){ const nh = Math.max(100, origH - dy); y = origY + (origH - nh); h = nh; }
  el.style.left = x+'px';
  el.style.top = y+'px';
  el.style.width = w+'px';
  el.style.height = h+'px';
}
function endResize(){
  if(!resizeCtx) return;
  const {el, winId} = resizeCtx;
  el.classList.remove('resizing');
  const page = getPage();
  const w = page.windows.find(x=>x.id===winId);
  if(w){
    w.x = parseFloat(el.style.left)||0;
    w.y = parseFloat(el.style.top)||0;
    w.w = parseFloat(el.style.width)||300;
    w.h = parseFloat(el.style.height)||200;
    save();
  }
  resizeCtx = null;
  document.removeEventListener('mousemove', onResize);
  document.removeEventListener('mouseup', endResize);
}

/* ---------- WINDOW OPERATIONS ---------- */
function addWindow(opts){
  const page = getPage();
  const frame = opts.frame || pickRandomFrame(page);
  const newWin = {
    id: uid('w'),
    name: opts.name || 'New Window',
    url: opts.url || 'https://example.com',
    x: opts.x ?? (60 + Math.random()*120),
    y: opts.y ?? (60 + Math.random()*80),
    w: opts.w ?? 500,
    h: opts.h ?? 380,
    frame,
    minimized: false,
    maximized: false,
    pinned: false,
    z: ++state.maxZ
  };
  page.windows.push(newWin);
  save();
  renderWorkspace();
  const el = windowEls.get(newWin.id);
  if(el){ el.classList.add('new'); setTimeout(()=>el.classList.remove('new'), 400); }
  selectWindow(newWin.id);
  updateCounts();
}
function closeWindow(winId){
  const page = getPage();
  const idx = page.windows.findIndex(x=>x.id===winId);
  if(idx<0) return;
  const el = windowEls.get(winId);
  if(el){ el.classList.add('closing'); setTimeout(()=>{ el.remove(); windowEls.delete(winId); }, 260); }
  page.windows.splice(idx,1);
  save();
  renderPages();
  renderPageHeader();
  updateCounts();
  setTimeout(renderWorkspace, 100);
}
function duplicateWindow(winId){
  const page = getPage();
  const w = page.windows.find(x=>x.id===winId);
  if(!w) return;
  const copy = {...w, id: uid('w'), x: w.x+30, y: w.y+30, z: ++state.maxZ, pinned: false};
  page.windows.push(copy);
  save();
  renderWorkspace();
}
function togglePin(winId){
  const page = getPage();
  const w = page.windows.find(x=>x.id===winId);
  if(!w) return;
  w.pinned = !w.pinned;
  if(w.pinned){ state.maxPinZ++; w.z = state.maxPinZ; }
  else { state.maxZ++; w.z = state.maxZ; }
  const el = windowEls.get(winId);
  if(el){ el.classList.toggle('pinned', w.pinned); el.style.zIndex = w.z; }
  save();
  toast(w.pinned ? '📌 Đã ghim cửa sổ' : 'Đã bỏ ghim');
}
function toggleMinimize(winId){
  const page = getPage();
  const w = page.windows.find(x=>x.id===winId);
  if(!w) return;
  w.minimized = !w.minimized;
  if(w.minimized) w.maximized = false;
  const el = windowEls.get(winId);
  if(el) el.classList.toggle('minimized', w.minimized);
  if(w.minimized) el.classList.remove('maximized');
  save();
}
function toggleMaximize(winId){
  const page = getPage();
  const w = page.windows.find(x=>x.id===winId);
  if(!w) return;
  w.maximized = !w.maximized;
  if(w.maximized) w.minimized = false;
  const el = windowEls.get(winId);
  if(el){
    el.classList.toggle('maximized', w.maximized);
    if(w.maximized) el.classList.remove('minimized');
  }
  save();
}
function reloadWindow(winId){
  const page = getPage();
  const w = page.windows.find(x=>x.id===winId);
  if(!w) return;
  const el = windowEls.get(winId);
  if(el) loadIframeInto(el.querySelector('.win-body'), w.url);
  toast('🔄 Đã tải lại');
}
function randomFrameWindow(winId){
  const page = getPage();
  const w = page.windows.find(x=>x.id===winId);
  if(!w) return;
  w.frame = pickRandomFrame(page, winId);
  const el = windowEls.get(winId);
  if(el){ el.dataset.frame = w.frame; el.classList.add('new'); setTimeout(()=>el.classList.remove('new'), 400); }
  save();
  toast('🎲 Khung mới: '+FRAMES.find(f=>f.id===w.frame).name);
}
function randomAllFrames(){
  const page = getPage();
  if(page.windows.length===0){ toast('Chưa có cửa sổ nào'); return; }
  const used = new Set();
  page.windows.forEach(w=>{
    let f = pickRandomFrame(page, w.id, used);
    w.frame = f;
    used.add(f);
    const el = windowEls.get(w.id);
    if(el) el.dataset.frame = f;
  });
  save();
  toast('🎲 Đã đổi khung cho tất cả cửa sổ');
}
function pickRandomFrame(page, excludeId, extraExclude){
  const used = new Set(extraExclude||[]);
  page.windows.forEach(w=>{ if(w.id!==excludeId) used.add(w.frame); });
  const pool = FRAMES.filter(f=>!used.has(f.id));
  const arr = pool.length ? pool : FRAMES;
  return arr[Math.floor(Math.random()*arr.length)].id;
}
function arrangeWindows(){
  const page = getPage();
  const ws = qs('#workspace');
  const W = ws.clientWidth, H = ws.clientHeight;
  const n = page.windows.length;
  if(!n){ toast('Chưa có cửa sổ nào'); return; }
  const cols = Math.ceil(Math.sqrt(n));
  const rows = Math.ceil(n/cols);
  const gap = 14;
  const cw = (W - gap*(cols+1)) / cols;
  const ch = (H - gap*(rows+1)) / rows;
  page.windows.forEach((w, i)=>{
    const c = i % cols, r = Math.floor(i/cols);
    w.x = gap + c*(cw+gap);
    w.y = gap + r*(ch+gap);
    w.w = Math.max(200, cw);
    w.h = Math.max(140, ch);
    w.maximized = false; w.minimized = false;
    const el = windowEls.get(w.id);
    if(el){
      el.style.left = w.x+'px';
      el.style.top = w.y+'px';
      el.style.width = w.w+'px';
      el.style.height = w.h+'px';
      el.classList.remove('maximized','minimized');
    }
  });
  save();
  toast('✨ Đã sắp xếp cửa sổ');
}

/* ---------- MODE ENGINE ---------- */
function applyModeLayout(modeId, saveMode = true) {
  const page = getPage();
  if(saveMode) { page.mode = modeId; save(); }
  
  const ws = qs('#workspace');
  const W = ws.clientWidth || 1200;
  const H = ws.clientHeight || 800;
  const n = page.windows.length;
  if(n === 0) return;

  // Reset default styles
  page.windows.forEach(w => {
    w.maximized = false;
    w.minimized = false;
    const el = windowEls.get(w.id);
    if(el) { el.classList.remove('maximized','minimized'); el.style.transform = ''; el.style.opacity = '1'; el.style.filter = ''; }
  });

  if (modeId === 'm02') { // Smart Grid
    const cols = Math.ceil(Math.sqrt(n));
    const rows = Math.ceil(n/cols);
    const gap = 14;
    const cw = (W - gap*(cols+1)) / cols;
    const ch = (H - gap*(rows+1)) / rows;
    page.windows.forEach((w, i) => {
      const c = i % cols, r = Math.floor(i/cols);
      w.x = gap + c*(cw+gap); w.y = gap + r*(ch+gap);
      w.w = Math.max(200, cw); w.h = Math.max(140, ch);
    });
  } else if (modeId === 'm03') { // Masonry
    const cols = 3;
    const gap = 14;
    const cw = (W - gap*(cols+1)) / cols;
    let colHeights = [gap, gap, gap];
    page.windows.forEach((w) => {
      const minCol = colHeights.indexOf(Math.min(...colHeights));
      w.x = gap + minCol*(cw+gap);
      w.y = colHeights[minCol];
      w.w = cw;
      w.h = 200 + Math.random()*200; // varying heights
      colHeights[minCol] += w.h + gap;
    });
  } else if (modeId === 'm04') { // Split Screen
    const cols = n === 1 ? 1 : (n === 2 ? 2 : (n <= 4 ? 2 : 3));
    const rows = Math.ceil(n/cols);
    const gap = 10;
    const cw = (W - gap*(cols+1)) / cols;
    const ch = (H - gap*(rows+1)) / rows;
    page.windows.forEach((w, i) => {
      const c = i % cols, r = Math.floor(i/cols);
      w.x = gap + c*(cw+gap); w.y = gap + r*(ch+gap);
      w.w = cw; w.h = ch;
    });
  } else if (modeId === 'm05') { // Focus Window
    const mainW = page.windows[0];
    mainW.x = 20; mainW.y = 20; mainW.w = W - 40; mainW.h = H - 40;
    mainW.maximized = true;
    page.windows.slice(1).forEach(w => {
      w.x = W - 300; w.y = 20; w.w = 280; w.h = 200;
      const el = windowEls.get(w.id);
      if(el) el.style.opacity = '0.4';
    });
    const mainEl = windowEls.get(mainW.id);
    if(mainEl) { mainEl.classList.add('maximized'); mainEl.style.opacity = '1'; }
    return;
  } else if (modeId === 'm06') { // PiP
    page.windows.forEach((w, i) => {
      if(i === n-1) { // last one is PiP
        w.x = W - 350; w.y = H - 250; w.w = 320; w.h = 220;
      } else {
        w.x = 20 + i*30; w.y = 20 + i*30; w.w = 600; w.h = 400;
      }
    });
  } else if (modeId === 'm07') { // Floating Windows
    page.windows.forEach((w, i) => {
      w.x = 50 + i*60; w.y = 50 + i*60; w.w = 480; w.h = 360;
      const el = windowEls.get(w.id);
      if(el) { el.style.transform = `rotate(${(Math.random()-0.5)*4}deg) translateZ(0)`; }
    });
  } else if (modeId === 'm09') { // Window Stack
    page.windows.forEach((w, i) => {
      w.x = 40 + i*20; w.y = 40 + i*20; w.w = 500; w.h = 380;
      const el = windowEls.get(w.id);
      if(el) { el.style.zIndex = i+1; }
    });
  } else if (modeId === 'm10') { // Infinite Canvas
    // Already infinite by default, just arrange them nicely
    page.windows.forEach((w, i) => {
      w.x = 40 + (i % 4) * 520;
      w.y = 40 + Math.floor(i / 4) * 420;
      w.w = 480; w.h = 380;
    });
  } else {
    // Free Space or other modes default
    // If their positions are 0, spread them
    page.windows.forEach((w, i) => {
      if(w.x === 0 && w.y === 0) {
        w.x = 60 + (i % 3) * 300;
        w.y = 60 + Math.floor(i / 3) * 250;
      }
    });
  }

  // Apply positions
  page.windows.forEach(w => {
    const el = windowEls.get(w.id);
    if(el) {
      el.style.left = w.x + 'px';
      el.style.top = w.y + 'px';
      el.style.width = w.w + 'px';
      el.style.height = w.h + 'px';
      el.classList.remove('maximized','minimized');
      el.style.opacity = '1';
    }
  });

  // Toggle specific UI for modes
  if (modeId === 'm08') { // Minimal
    qs('#sidebar').classList.add('collapsed');
    qs('#toolbar').style.opacity = '0.2';
    qs('#toolbar').style.pointerEvents = 'none';
  } else {
    qs('#sidebar').classList.remove('collapsed');
    qs('#toolbar').style.opacity = '1';
    qs('#toolbar').style.pointerEvents = 'auto';
  }

  // Widgets
  qsa('.floating-widget').forEach(el => el.classList.remove('show'));
  if (modeId === 'm15') { // Pomodoro
    let pw = qs('#widget-pomodoro');
    if(!pw) { createPomodoroWidget(); pw = qs('#widget-pomodoro'); }
    pw.classList.add('show');
  } else if (modeId === 'm19') { // Task Board
    let tw = qs('#widget-tasks');
    if(!tw) { createTaskWidget(); tw = qs('#widget-tasks'); }
    tw.classList.add('show');
  } else if (modeId === 'm20') { // Notes
    let nw = qs('#widget-notes');
    if(!nw) { createNotesWidget(); nw = qs('#widget-notes'); }
    nw.classList.add('show');
  }
}

function createPomodoroWidget() {
  const el = document.createElement('div');
  el.id = 'widget-pomodoro';
  el.className = 'floating-widget';
  el.innerHTML = `
    <div class="fw-header"><div class="fw-title">⏱ Pomodoro</div><button class="fw-close" onclick="this.parentElement.parentElement.classList.remove('show')">✕</button></div>
    <div class="fw-timer" id="pomo-time">25:00</div>
    <div style="display:flex;gap:6px">
      <button class="btn primary sm" style="flex:1" onclick="togglePomodoro()">Start / Pause</button>
      <button class="btn sm" onclick="resetPomodoro()">Reset</button>
    </div>
  `;
  document.body.appendChild(el);
}
let pomoInterval, pomoTime = 25*60, pomoRunning = false;
function togglePomodoro() {
  if(pomoRunning) { clearInterval(pomoInterval); }
  else {
    pomoInterval = setInterval(() => {
      if(pomoTime > 0) { pomoTime--; updatePomoUI(); }
      else { clearInterval(pomoInterval); toast('⏱ Hết giờ Pomodoro!'); pomoRunning=false; }
    }, 1000);
  }
  pomoRunning = !pomoRunning;
}
function resetPomodoro() { clearInterval(pomoInterval); pomoRunning=false; pomoTime = 25*60; updatePomoUI(); }
function updatePomoUI() {
  const m = Math.floor(pomoTime/60).toString().padStart(2,'0');
  const s = (pomoTime%60).toString().padStart(2,'0');
  const el = qs('#pomo-time');
  if(el) el.textContent = `${m}:${s}`;
}

}

function createTaskWidget() {
  const el = document.createElement('div');
  el.id = 'widget-tasks';
  el.className = 'floating-widget';
  el.innerHTML = `
    <div class="fw-header"><div class="fw-title">✅ Task Board</div><button class="fw-close" onclick="this.parentElement.parentElement.classList.remove('show')">✕</button></div>
    <div class="fw-task-list" id="task-list"></div>
    <div style="display:flex;gap:4px;margin-top:6px">
      <input type="text" id="new-task-input" class="mini-input" placeholder="Việc mới..." style="flex:1" onkeydown="if(event.key==='Enter')addTask()">
      <button class="btn primary sm" onclick="addTask()">＋</button>
    </div>
  `;
  document.body.appendChild(el);

let tasks = JSON.parse(localStorage.getItem('mochi-tasks') || '[]');
function renderTasks() {
  const list = qs('#task-list');
  if(!list) return;
  list.innerHTML = tasks.map((t, i) => `
    <div class="fw-task">
      <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${i})">
      <span style="flex:1;text-decoration:${t.done?'line-through':'none'}">${esc(t.text)}</span>
      <button style="color:#ff5a7a;font-weight:800" onclick="delTask(${i})">✕</button>
    </div>
  `).join('');
}
function addTask() {
  const inp = qs('#new-task-input');
  if(inp.value.trim()) {
    tasks.push({text: inp.value.trim(), done: false});
    inp.value = '';
    localStorage.setItem('mochi-tasks', JSON.stringify(tasks));
    renderTasks();
  }
}
function toggleTask(i) {
  tasks[i].done = !tasks[i].done;
  localStorage.setItem('mochi-tasks', JSON.stringify(tasks));
  renderTasks();
}
function delTask(i) {
  tasks.splice(i, 1);
  localStorage.setItem('mochi-tasks', JSON.stringify(tasks));
  renderTasks();
}

  const p = state.pages.find(x=>x.id===id);
  if(!p) return;
  const copy = JSON.parse(JSON.stringify(p));
  copy.id = uid('p');
  copy.name = p.name + ' (copy)';

  toast('⧉ Đã nhân bản trang');

function deletePage(id){
  if(state.pages.length<=1){ toast('Không thể xóa trang cuối cùng','error'); return; }
  const p = state.pages.find(x=>x.id===id);
  if(!p) return;
  openModal({
    title:'⚠ Xóa trang',
    body:`<p style="font-size:13px">Bạn có chắc muốn xóa trang <b>${esc(p.name)}</b>? Tất cả ${p.windows.length} cửa sổ sẽ bị xóa.</p>`,
    footer:`
      <button class="btn ghost" onclick="closeModal()">Hủy</button>
      <button class="btn danger" onclick="doDeletePage('${id}')">Xóa</button>
    `
  });
}
function doDeletePage(id){
  const idx = state.pages.findIndex(x=>x.id===id);
  if(idx<0) return;
  const p = state.pages[idx];
  p.windows.forEach(w=>{
    const el = windowEls.get(w.id);
    if(el) el.remove();
    windowEls.delete(w.id);
  });
  state.pages.splice(idx,1);
  if(state.activePageId===id) state.activePageId = state.pages[0].id;
  save(); closeModal(); renderWorkspace();
}
