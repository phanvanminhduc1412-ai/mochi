  grid.innerHTML = '';
  THEMES.filter(t=>!q || t.name.toLowerCase().includes(q) || t.id.includes(q)).forEach(t=>{
    const card = document.createElement('div');
    card.className = 'theme-card' + (t.id===page.theme?' active':'');
    card.innerHTML = `
      <div class="theme-preview" style="background:${t.bg}">
        <div class="mini-win" style="--mini-title:${t.accent}"></div>
      </div>
      <div class="card-label">${t.emoji} ${esc(t.name)}</div>
    `;
    card.addEventListener('click', ()=>applyTheme(t.id));
    grid.appendChild(card);
  });
}
function applyTheme(id){
  const page = getPage();
  page.theme = id;
  save();
  document.body.dataset.theme = id;
  renderPageHeader();
  renderThemeGrid();
  toast('🎨 Đã đổi theme: '+THEMES.find(t=>t.id===id).name);
}

/* ---------- FRAME GALLERY ---------- */
function openFrameGallery(){
  const groups = ['All', ...new Set(FRAMES.map(f=>f.group))];
  const html = `
    <div class="search-row">
      <input id="fg-search" placeholder="🔍 Tìm khung..." oninput="fgState.search=this.value;fgState.page=1;renderFrameGrid()">
      <button class="btn sm" onclick="randomAllFrames()">🎲 Random All</button>
    </div>
    <div class="filter-chips" id="fg-groups">
      ${groups.map(g=>`<button class="chip ${g===fgState.filterGroup?'active':''}" onclick="setFrameGroup('${g}')">${esc(g)}</button>`).join('')}
    </div>
    <div class="filter-chips" id="fg-types">
      <button class="chip ${fgState.filterType==='All'?'active':''}" onclick="setFrameType('All')">All Frames</button>
      <button class="chip ${fgState.filterType==='Old'?'active':''}" onclick="setFrameType('Old')">Old (1-50)</button>
      <button class="chip ${fgState.filterType==='New'?'active':''}" onclick="setFrameType('New')">New (51-100)</button>
      <button class="chip ${fgState.filterType==='Fav'?'active':''}" onclick="setFrameType('Fav')">❤ Yêu thích</button>
    </div>
    <div class="gallery-grid frame-grid" id="frame-grid"></div>
    <div class="pagination" id="fg-pagination"></div>
  `;
  openModal({
    title:'🖼 Frame Gallery — 100 frames',
    wide:true,
    body:html,
    footer:`
      <button class="btn ghost" onclick="closeModal()">Đóng</button>
      <button class="btn primary" onclick="applyFrameToSelected()">Áp dụng cho cửa sổ đã chọn</button>
    `
  });
  renderFrameGrid();
}

function setFrameGroup(g) { fgState.filterGroup = g; fgState.page = 1; qsa('#fg-groups .chip').forEach(c=>c.classList.toggle('active', c.textContent===g)); renderFrameGrid(); }
function setFrameType(t) { fgState.filterType = t; fgState.page = 1; qsa('#fg-types .chip').forEach(c=>c.classList.toggle('active', c.textContent.includes(t) || (t==='All'&&c.textContent==='All Frames'))); renderFrameGrid(); }

function renderFrameGrid(){
  const grid = qs('#frame-grid');
  if(!grid) return;
  const page = getPage();
  const sel = selectedWindowId ? page.windows.find(x=>x.id===selectedWindowId) : null;
  const currentFrame = sel ? sel.frame : null;
  
  let filtered = FRAMES.filter(f => {
    if(fgState.filterGroup !== 'All' && f.group !== fgState.filterGroup) return false;
    if(fgState.filterType === 'Old' && f.isNew) return false;
    if(fgState.filterType === 'New' && !f.isNew) return false;
    if(fgState.filterType === 'Fav' && !state.favorites.includes(f.id)) return false;
    if(fgState.search && !f.name.toLowerCase().includes(fgState.search.toLowerCase()) && !f.group.toLowerCase().includes(fgState.search.toLowerCase())) return false;
    return true;
  });

  const totalPages = Math.ceil(filtered.length / fgState.perPage) || 1;
  if(fgState.page > totalPages) fgState.page = totalPages;
  const start = (fgState.page - 1) * fgState.perPage;
  const pageItems = filtered.slice(start, start + fgState.perPage);

  grid.innerHTML = '';
  pageItems.forEach(f => {
    const isFav = state.favorites.includes(f.id);
    const card = document.createElement('div');
    card.className = 'frame-card' + (f.id===currentFrame?' active':'');
    card.innerHTML = `
      <button class="fav-btn ${isFav?'active':''}" onclick="event.stopPropagation();toggleFav('${f.id}')">${isFav?'❤':'🤍'}</button>
      <div class="frame-preview">
        <div class="mini-frame win" data-frame="${f.id}" style="--win-r:8px;--win-bg:#fff;--win-border:var(--accent);--win-title:var(--accent);--win-title-text:#fff">
          <div class="win-inner" style="border-width:2px">
            <div class="mf-tb"></div>
            <div class="mf-body"></div>
          </div>
        </div>
      </div>
      <div class="card-label">${esc(f.name)}</div>
    `;
    card.addEventListener('click', ()=>{
      if(selectedWindowId){ applyFrameToWindow(selectedWindowId, f.id); }
      else { tempFrameSelection = f.id; toast('Chọn một cửa sổ trước để áp dụng khung'); }
      qsa('#frame-grid .frame-card').forEach(c=>c.classList.remove('active'));
      card.classList.add('active');
    });
    grid.appendChild(card);
  });

  // Pagination
  const pag = qs('#fg-pagination');
  if(pag) {
    pag.innerHTML = `
      <button ${fgState.page===1?'disabled':''} onclick="fgState.page--;renderFrameGrid()">← Prev</button>
      <span>Trang ${fgState.page} / ${totalPages} (${filtered.length} khung)</span>
      <button ${fgState.page===totalPages?'disabled':''} onclick="fgState.page++;renderFrameGrid()">Next →</button>
    `;
  }
}
function toggleFav(id) {
  const idx = state.favorites.indexOf(id);
  if(idx >= 0) state.favorites.splice(idx, 1);
  else state.favorites.push(id);
  save();
  renderFrameGrid();
}
function applyFrameToSelected(){
  if(!selectedWindowId){ toast('Hãy chọn một cửa sổ trước','error'); return; }
  const active = qs('#frame-grid .frame-card.active');
  if(!active) { toast('Hãy chọn một khung','error'); return; }
  closeModal();
  toast('✨ Đã áp dụng khung');
}
function applyFrameToWindow(winId, frameId){
  const page = getPage();
  const w = page.windows.find(x=>x.id===winId);
  if(!w) return;
  w.frame = frameId;
  save();
  const el = windowEls.get(winId);
  if(el){
    el.dataset.frame = frameId;
    el.classList.add('new');
    setTimeout(()=>el.classList.remove('new'), 400);
  }
  toast('🖼 '+FRAMES.find(f=>f.id===frameId).name);
}

/* ---------- WINDOW MANAGER ---------- */
function openWindowManager(){
  const page = getPage();
  openModal({
    title:'🗂 Window Manager',
    wide:true,
    body:`
      <div class="search-row">
        <input id="wm-search" placeholder="🔍 Tìm theo tên..." oninput="renderWindowManager()">
        <button class="btn sm danger" onclick="closeSelectedWindows()">Đóng đã chọn</button>
      </div>
      <div class="wm-list" id="wm-list"></div>
    `,
    footer:`<button class="btn primary" onclick="closeModal()">Đóng</button>`
  });
  renderWindowManager();
}
function renderWindowManager(){
  const list = qs('#wm-list');
  if(!list) return;
  const page = getPage();
  const q = (qs('#wm-search')?.value||'').toLowerCase();
  const filtered = page.windows.filter(w=>!q || w.name.toLowerCase().includes(q) || w.url.toLowerCase().includes(q));
  if(filtered.length===0){
    list.innerHTML = `<div style="padding:30px;text-align:center;color:var(--text-dim);font-size:12px">Không có cửa sổ nào</div>`;
    return;
  }
  list.innerHTML = filtered.map(w=>`
    <div class="wm-item">
      <input type="checkbox" class="wm-check" data-id="${w.id}">
      <div class="wm-info">
        <div class="wm-name">${esc(w.name)}</div>
        <div class="wm-url">${esc(w.url)}</div>
      </div>
      <div class="wm-meta">
        <div>${Math.round(w.w)}×${Math.round(w.h)}</div>
        <div>${esc(FRAMES.find(f=>f.id===w.frame)?.name || '?')}</div>
      </div>
      <div class="wm-actions">
        <button title="Xem" onclick="focusWindowFromManager('${w.id}')">👁</button>
        <button title="Cài đặt" onclick="openWindowSettings('${w.id}')">⚙</button>
        <button title="Đóng" onclick="closeWindow('${w.id}');renderWindowManager()">✕</button>
      </div>
    </div>
  `).join('');
}
function focusWindowFromManager(winId){
  closeModal();
  selectWindow(winId);
  const el = windowEls.get(winId);
  if(el){ el.scrollIntoView({block:'center',behavior:'smooth'}); el.classList.add('new'); setTimeout(()=>el.classList.remove('new'),400); }
}
function closeSelectedWindows(){
  const checks = qsa('#wm-list .wm-check:checked');
  if(checks.length===0){ toast('Chưa chọn cửa sổ nào','error'); return; }
  openModal({
    title:'⚠ Xác nhận đóng',
    body:`<p style="font-size:13px">Bạn có chắc muốn đóng <b>${checks.length}</b> cửa sổ đã chọn?</p>`,
    footer:`
      <button class="btn ghost" onclick="closeModal();openWindowManager()">Hủy</button>
      <button class="btn danger" onclick="confirmCloseSelected()">Đóng ${checks.length} cửa sổ</button>
    `
  });
}
function confirmCloseSelected(){
  const checks = qsa('#wm-list .wm-check:checked');
  const ids = checks.map(c=>c.dataset.id);
  closeModal();
  ids.forEach(id=>closeWindow(id));
  toast(`Đã đóng ${ids.length} cửa sổ`);
  setTimeout(openWindowManager, 300);
}

/* ---------- SETTINGS ---------- */
function openSettings(){
  const s = state.settings;
  openModal({
    title:'⚙ Settings',
    body:`
      <div class="form-group">
        <label>Hiệu ứng nền & particles</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="checkbox" id="st-fx" ${s.effects?'checked':''} style="width:auto">
          <span style="font-size:12px">Bật hiệu ứng hạt sáng, bong bóng, animation</span>
        </div>
      </div>
      <div class="form-group">
        <label>Giảm chuyển động</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="checkbox" id="st-rm" ${s.reduceMotion?'checked':''} style="width:auto">
          <span style="font-size:12px">Tắt animation (dành cho thiết bị yếu)</span>
        </div>
      </div>
      <hr style="border:none;border-top:1px solid rgba(0,0,0,.1);margin:16px 0">
      <div class="form-group">
        <label>Dữ liệu</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sm" onclick="exportWorkspace()">📤 Export</button>
          <button class="btn sm" onclick="document.getElementById('import-file').click()">📥 Import</button>
          <button class="btn sm danger" onclick="resetWorkspace()">🔄 Reset</button>
          <input type="file" id="import-file" accept="application/json,.json" style="display:none" onchange="doImport(event)">
        </div>
        <div style="font-size:11px;color:var(--text-dim);margin-top:8px">💡 Dữ liệu được lưu trong localStorage của trình duyệt. Không có thông tin đăng nhập được lưu.</div>
      </div>
      <hr style="border:none;border-top:1px solid rgba(0,0,0,.1);margin:16px 0">
      <div style="font-size:11px;color:var(--text-dim);line-height:1.6">
        <b>Mochi Space 5D</b> — Không gian làm việc anime kawaii với 20 theme, 100 khung và 30 mode.<br>
        Lưu ý: Một số website (Google, YouTube, Facebook...) chặn nhúng iframe. Hãy dùng nút "Mở tab mới".
      </div>
    `,
    footer:`<button class="btn primary" onclick="saveSettings()">Lưu</button>`
  });
}
function saveSettings(){
  state.settings.effects = qs('#st-fx').checked;
  state.settings.reduceMotion = qs('#st-rm').checked;
  document.body.classList.toggle('reduce-motion', state.settings.reduceMotion);
  document.getElementById('particles').style.display = state.settings.effects && !state.settings.reduceMotion ? '' : 'none';
  save(); closeModal();
  toast('✅ Đã lưu cài đặt');
}
function toggleEffects(){
  state.settings.effects = !state.settings.effects;
  document.getElementById('particles').style.display = state.settings.effects && !state.settings.reduceMotion ? '' : 'none';
  save();
  toast(state.settings.effects ? '✨ Bật hiệu ứng' : 'Hiệu ứng đã tắt');
}
function exportWorkspace(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'mochi-space-5d-'+Date.now()+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('📤 Đã export');
}
function doImport(ev){
  const file = ev.target.files[0];
  if(!file) return;
  if(file.size > 5*1024*1024){ toast('File quá lớn (>5MB)','error'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.pages)) throw new Error('Invalid');
      if(!data.pages.every(p=>p.id && Array.isArray(p.windows))) throw new Error('Invalid pages');
      windowEls.forEach((el,id)=>{ el.remove(); });
      windowEls.clear();
      state = Object.assign({}, state, data);
      if(!state.pages.length) throw new Error('No pages');
      if(!state.pages.find(p=>p.id===state.activePageId)) state.activePageId = state.pages[0].id;
      state.pages.forEach(p => {
        if(!p.mode) p.mode = 'm01';
        p.windows.forEach(w => {
          if(!FRAMES.find(f=>f.id===w.frame)) w.frame = 'mochi';
        });
      });
      save(); closeModal(); renderWorkspace();
      toast('📥 Import thành công');
    }catch(e){ toast('File không hợp lệ','error'); }
  };
  reader.readAsText(file);
}
function resetWorkspace(){
  openModal({
    title:'⚠ Reset Workspace',
    body:`<p style="font-size:13px">Bạn có chắc muốn xóa toàn bộ dữ liệu và khôi phục về trạng thái ban đầu?</p>`,
    footer:`
      <button class="btn ghost" onclick="closeModal()">Hủy</button>
      <button class="btn danger" onclick="doReset()">Reset</button>
    `
  });
}
function doReset(){
  localStorage.removeItem(STORAGE_KEY);
  windowEls.forEach(el=>el.remove());
  windowEls.clear();
  state = {
    version:2,
    activePageId:'p_home',
    pages:JSON.parse(JSON.stringify(DEFAULT_PAGES)),
    settings:{effects:true,reduceMotion:false},
    favorites:[],
    maxZ:10,maxPinZ:100000
  };
  closeModal();
  renderWorkspace();
  toast('🔄 Đã reset workspace');
}

/* ---------- MODALS ---------- */
let modalStack = [];
function openModal({title, body, footer, wide}){
  const modals = qs('#modals');
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `
    <div class="modal-box ${wide?'wide':''}">
      <div class="modal-head">
        <span class="m-icon">✨</span>
        <h2>${esc(title)}</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">${body}</div>
      ${footer?`<div class="modal-foot">${footer}</div>`:''}
    </div>
  `;
  wrap.addEventListener('click', e=>{ if(e.target===wrap) closeModal(); });
  modals.appendChild(wrap);
  modalStack.push(wrap);
}
function closeModal(){
  const m = modalStack.pop();
  if(m) m.remove();
}

/* ---------- COUNTS ---------- */
function updateCounts(){
  const p = getPage();
  qs('#win-count-badge').textContent = p.windows.length;
  qs('#cur-page-stat').textContent = `${p.windows.length} cửa sổ • ${p.windows.filter(w=>!w.minimized).length} đang hoạt động`;
}

/* ---------- RIGHT RAIL ---------- */
function toggleRail(){
  qs('#right-rail').classList.toggle('open');
}

/* ---------- PARTICLES ---------- */
let particleCanvas, pctx, particles = [], pAnim;
function initParticles(){
  particleCanvas = qs('#particles');
  pctx = particleCanvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  for(let i=0;i<40;i++) particles.push(newParticle());
  animateParticles();
}
function resizeCanvas(){
  particleCanvas.width = window.innerWidth;
  particleCanvas.height = window.innerHeight;
}
function newParticle(){
  return {
    x: Math.random()*window.innerWidth,
    y: Math.random()*window.innerHeight,
    r: 1+Math.random()*3,
    vx: (Math.random()-.5)*.3,
    vy: -0.2 - Math.random()*.4,
    a: Math.random()*Math.PI*2,
    hue: Math.random()*360,
    life: 1
  };
}
function animateParticles(){
  pAnim = requestAnimationFrame(animateParticles);
  if(!state.settings.effects || state.settings.reduceMotion) return;
  pctx.clearRect(0,0,particleCanvas.width, particleCanvas.height);
  for(const p of particles){
    p.x += p.vx; p.y += p.vy; p.a += .01;
    if(p.y < -10){ p.y = particleCanvas.height+10; p.x = Math.random()*particleCanvas.width; }
    if(p.x < -10) p.x = particleCanvas.width+10;
    if(p.x > particleCanvas.width+10) p.x = -10;
    const alpha = .3 + Math.sin(p.a)*.3;
    pctx.beginPath();
    pctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    pctx.fillStyle = `hsla(${p.hue},80%,70%,${alpha})`;
    pctx.shadowColor = `hsla(${p.hue},80%,70%,.8)`;
    pctx.shadowBlur = 8;
    pctx.fill();
  }
}

/* ---------- KEYBOARD SHORTCUTS ---------- */
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){ closeModal(); }
  if((e.ctrlKey||e.metaKey) && e.key==='n'){
    e.preventDefault(); openAddWindow();
  }
});

/* ---------- INIT ---------- */
function init(){
  load();
  document.body.dataset.theme = (getPage().theme || 'pink-mochi');
  document.body.classList.toggle('reduce-motion', state.settings.reduceMotion);
  
  // Fix: Bind New Page button
  qs('#new-page-btn').addEventListener('click', () => addPage());
  
  renderWorkspace();
  initParticles();
  qs('#particles').style.display = state.settings.effects && !state.settings.reduceMotion ? '' : 'none';
  if(!state.settings.effects) qs('#particles').style.display = 'none';
  updateCounts();
}
init();

/* expose functions to global */
Object.assign(window, {
  openAddWindow, doAddWindow, pasteUrl, randomFrameId,
  openThemeGallery, renderThemeGrid, applyTheme,
  openFrameGallery, renderFrameGrid, setFrameGroup, setFrameType, toggleFav, applyFrameToSelected,
  openModeCenter, renderModeGrid, setModeFilter, applyModeLayout,
  openWindowManager, renderWindowManager, focusWindowFromManager, closeSelectedWindows, confirmCloseSelected,
  openSettings, saveSettings, exportWorkspace, doImport, resetWorkspace, doReset,
  closeModal, toggleRail, toggleEffects,
  randomAllFrames, arrangeWindows,
  closeWindow, openWindowSettings,
  doEditWindowUrl, doDeleteWindow, doApplyWindowSettings, applySizePreset,
  doRenamePage, doDeletePage,
  randomFrameWindow,
  // Widgets
  togglePomodoro, resetPomodoro, addTask, toggleTask, delTask
});
</script>
